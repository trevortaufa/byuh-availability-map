<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the notch; the CSS then
         pads it back with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1220" />

    <!-- Generic map pin, generated by scripts/make-favicon.py. Deliberately not
         the BYUH logo: this is an unaffiliated project and their mark would
         imply otherwise. SVG first for crispness, PNGs for older browsers. -->
    <link rel="icon" type="image/svg+xml" href="/pin.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>What's open — BYU–Hawaii</title>
    <meta
      name="description"
      content="Which BYU–Hawaii campus facilities are open right now."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
